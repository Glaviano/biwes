[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biwes"
version = "0.1.0"
description = "BiWES – Bipartite Weighted Edge Shuffling: randomisation of bipartite weighted graphs preserving degree and weight sequences."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
    "numpy",
    "numba",
    "ortools",
]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["biwes*"]